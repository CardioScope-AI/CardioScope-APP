services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cardioscope
      POSTGRES_USER: cardioscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardioscope -d cardioscope"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
  backend:
    build:
      context: ../CardioScope-BACKEND
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    environment:
      MODEL_PATH: ${MODEL_PATH:-/models/pipeline.joblib}
      COMPARISON_MODEL_PATHS: ${COMPARISON_MODEL_PATHS:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: cardioscope
      DB_USER: cardioscope
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../CardioScope-DATA-ML/artifacts
        target: /models
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${CARDIOSCOPE_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      additional_contexts:
        frontend: ../CardioScope-FRONTEND
    ports:
      - "${CARDIOSCOPE_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
