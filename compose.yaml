services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cardioscope
      POSTGRES_USER: cardioscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardioscope -d cardioscope"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
  backend:
    build:
      context: ../CardioScope-BACKEND
    environment:
      MODEL_PATH: /models/pipeline.joblib
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: cardioscope
      DB_USER: cardioscope
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../CardioScope-DATA-ML/artifacts
        target: /models
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${CARDIOSCOPE_BIND_ADDRESS:-127.0.0.1}:8000:8000"
  frontend:
    build:
      context: ../CardioScope-FRONTEND
    command: ["npm", "run", "preview"]
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "${CARDIOSCOPE_BIND_ADDRESS:-127.0.0.1}:5173:5173"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
