services:
  backend:
    build:
      context: ../CardioScope-BACKEND
    environment:
      MODEL_PATH: /models/pipeline.joblib
    volumes:
      - type: bind
        source: ../CardioScope-DATA-ML/artifacts
        target: /models
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build:
      context: ../CardioScope-FRONTEND
    command: ["npm", "run", "preview"]
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_started
